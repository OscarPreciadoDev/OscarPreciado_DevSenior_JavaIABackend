spring.application.name=campusFlow

spring.datasource.url=jdbc:mysql://localhost:3306/campus_flow
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de claves de entorno de Stripe

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.price-pago-unico=${STRIPE_PRICE_PAGO_UNICO}
stripe.price-plan-individual=${STRIPE_PRICE_PLAN_INDIVIDUAL}
stripe.url-exito=http://localhost:8080/pago-exitoso
stripe.url-cancelado=http://localhost:8080/pago-cancelado

# Puerto del servidor, se puede configurar mediante la variable de entorno PORT, por defecto es 8080

server.port=${PORT:8080}